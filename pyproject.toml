[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "notagen"
version = "0.2.0"
description = "NotaGen: symbolic (ABC) classical music generation"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "torch>=2.4",
    "numpy>=1.26",
    "safetensors>=0.4",
    "abctoolkit==0.0.6",
    "samplings==0.1.7",
    "pyparsing>=3.1",  # data/abc2xml.py and xml2abc.py
]

[project.optional-dependencies]
mlx = ["mlx>=0.20; sys_platform == 'darwin' and platform_machine == 'arm64'"]
demo = ["gradio>=5,<6"]  # demo.py targets the Gradio 5 API
clamp = ["transformers>=4.40,<5", "huggingface-hub<1.0", "unidecode"]  # CLaMP 2 (BERT + XLM-R) features/rewards
train = ["wandb"]
dev = ["pytest>=8", "ruff>=0.6", "transformers==4.40.0"]  # transformers only as the legacy test oracle

[project.scripts]
notagen = "notagen.cli:main"

[tool.setuptools.packages.find]
include = ["notagen*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
extend-exclude = ["data/abc2xml.py", "data/xml2abc.py", "gradio/abc2xml.py", "notebook/abc2xml.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E741", "B905", "SIM115"]  # `l` for lines (legacy style); zips pair equal-length lists; long-lived log handles

[tool.ruff.lint.per-file-ignores]
"tests/legacy_ref/*" = ["ALL"]  # frozen pre-refactor oracles, intentionally unmodified
"notagen/abc.py" = ["E722", "B007", "SIM"]  # verbatim port of the legacy rest_unreduce
"tests/test_config.py" = ["E501"]  # released checkpoint filenames
